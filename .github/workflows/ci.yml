name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canumpe_test
          POSTGRES_PASSWORD: canumpe_test
          POSTGRES_DB: canumpe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canumpe_test -d canumpe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://canumpe_test:canumpe_test@localhost:5432/canumpe_test
      LOG_LEVEL: INFO
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[dev]

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy app

      - name: Alembic upgrade to head
        run: alembic upgrade head

      - name: pytest
        run: pytest

      - name: Build Docker image
        run: docker build -t canumpe-academic-platform:ci .
