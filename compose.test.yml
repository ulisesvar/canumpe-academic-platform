services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: canumpe_test
      POSTGRES_PASSWORD: canumpe_test
      POSTGRES_DB: canumpe_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canumpe_test -d canumpe_test"]
      interval: 5s
      timeout: 5s
      retries: 10
