# Local development only. Builds images locally and binds PostgreSQL to
# the conventional 5432 — fine on a developer workstation, which never
# also runs Moodle. Production uses compose.prod.yml (pulls prebuilt GHCR
# images, PostgreSQL on 127.0.0.1:5434) and does not run moodle-sync at
# all — see the README's "Host-native operational integration jobs".
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canumpe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canumpe}
      POSTGRES_DB: ${POSTGRES_DB:-canumpe}
    volumes:
      - canumpe_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canumpe} -d ${POSTGRES_DB:-canumpe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Always addresses the "db" service on the compose network. The
      # host-oriented DATABASE_URL in .env (using localhost) is for local
      # tooling running outside Docker and is intentionally not used here.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-canumpe}:${POSTGRES_PASSWORD:-canumpe}@db:5432/${POSTGRES_DB:-canumpe}
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-canumpe}:${POSTGRES_PASSWORD:-canumpe}@db:5432/${POSTGRES_DB:-canumpe}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:8000:8000"

  moodle-sync:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-canumpe}:${POSTGRES_PASSWORD:-canumpe}@db:5432/${POSTGRES_DB:-canumpe}
      MOODLE_DB_URL: ${MOODLE_DB_URL}
      MOODLE_COURSE_ID: ${MOODLE_COURSE_ID:-2}
    command: ["python", "-m", "app.integration.moodle.sync"]
    # Development/testing convenience ONLY — never used in production.
    # Production runs the sync natively on the CANUMPE host via systemd
    # (deploy/systemd/) so it can reach Moodle's PostgreSQL on localhost
    # without exposing it. Never started by `docker compose up`; run
    # explicitly:
    #   docker compose run --rm moodle-sync
    profiles: ["moodle-sync"]

  attendance-sync:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-canumpe}:${POSTGRES_PASSWORD:-canumpe}@db:5432/${POSTGRES_DB:-canumpe}
      ATTENDANCE_DB_URL: ${ATTENDANCE_DB_URL}
      ATTENDANCE_MOODLE_COURSE_ID: ${ATTENDANCE_MOODLE_COURSE_ID:-2}
    command: ["python", "-m", "app.integration.attendance.sync"]
    # Development/testing convenience ONLY — never used in production.
    # Production runs the sync natively on the CANUMPE host via systemd
    # (deploy/systemd/), the same way as the Moodle sync. Never started
    # by `docker compose up`; run explicitly:
    #   docker compose run --rm attendance-sync
    profiles: ["attendance-sync"]

volumes:
  canumpe_pg_data:
